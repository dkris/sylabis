[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coursec"
version = "0.1.0"
description = "The learning agent: compiles courses, grades real artifacts, adapts the path, and connects verified knowledge across one journey"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "python-dotenv",
    "anthropic",
    "httpx",
]

[project.scripts]
coursec = "coursec.cli:main"

[tool.setuptools]
packages = ["coursec"]
