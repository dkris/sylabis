[build-system]
# >=77 for PEP 639 SPDX license expressions (license = "AGPL-3.0-only")
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sylabis"
dynamic = ["version"]
description = "The learning agent: compiles courses, grades real artifacts, adapts the path, and connects verified knowledge across one journey"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Dhruva Krishnan", email = "dhruvakrishnan@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["learning", "education", "agent", "curriculum", "claude", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
tui = ["textual>=1.0"]

[project.urls]
Homepage = "https://github.com/dkris/sylabis"
Repository = "https://github.com/dkris/sylabis"
Issues = "https://github.com/dkris/sylabis/issues"
Changelog = "https://github.com/dkris/sylabis/blob/main/CHANGELOG.md"

[project.scripts]
sy = "sylabis.cli:main"
sylabis = "sylabis.cli:main"
sylabis-mcp = "sylabis.cli:mcp_main"

[tool.setuptools]
packages = ["sylabis"]

[tool.setuptools.dynamic]
version = { attr = "sylabis.__version__" }

# ---------------------------------------------------------------------------
# Lint. Default rule set (E4/E7/E9/F) with deliberate-style carve-outs:
#   E741  short loop names (`l` for line) are house style in list comps
#   E702  the `import x; x()` one-liner idiom (dotenv bootstrap et al.)
#   F541  f-strings without placeholders read fine and churn diffs
# Per-file ignores cover intentional layout choices, not bugs.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E741", "E702", "F541"]

[tool.ruff.lint.per-file-ignores]
"sylabis/llm.py" = ["E402"]      # imports follow the dotenv bootstrap line
"sylabis/console.py" = ["F401"]  # curated ANSI/terminal import surface
"sylabis/web.py" = ["F401", "F811"]  # transitional (WS1c in flight) — retighten after
"tests/run_all.py" = ["E402"]    # sys.path bootstrap precedes imports
